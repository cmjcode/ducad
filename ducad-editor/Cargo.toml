[workspace]
resolver = "2"
members = ["crates/*"]
# SolidCraft kernel (backend truck, PLAN_MIGRASI_TRUCK F2) di-vendor dengan
# manifest sendiri; sengaja BUKAN anggota workspace supaya `cargo test/clippy
# --workspace` tidak ikut menjalankan ~800 tes & lint kode pihak ketiga itu.
# Tetap ikut ter-build lewat dependensi path `ducad-kernel`.
exclude = ["vendors/solidcraft"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Yulius Jayuda <yulius.jayuda@gmail.com>"]

[workspace.dependencies]
ducad-core = { path = "crates/ducad-core" }
ducad-sketch = { path = "crates/ducad-sketch" }
ducad-kernel = { path = "crates/ducad-kernel" }
ducad-render = { path = "crates/ducad-render" }
ducad-io = { path = "crates/ducad-io" }
ducad-ui = { path = "crates/ducad-ui" }
ducad-i18n = { path = "crates/ducad-i18n" }
ducad-cloud = { path = "crates/ducad-cloud" }
ducad-engine = { path = "crates/ducad-engine" }
ducad-assist = { path = "crates/ducad-assist" }
ducad-ink = { path = "crates/ducad-ink" }
ducad-chat = { path = "crates/ducad-chat" }
ducad-mcp = { path = "crates/ducad-mcp" }
ducad-sim = { path = "crates/ducad-sim" }
ducad-glass = { path = "crates/ducad-glass" }
ducad-update = { path = "crates/ducad-update" }

dirs = "6.0"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = { version = "0.9", features = ["macros"] }
ttf-parser = "0.25"
kurbo = "0.13"
rstar = "0.12"
lyon_tessellation = "1.0"
lyon_path = "1.0"
criterion = "0.5"
proptest = "1"
i_overlay = "9.0"

glam = { version = "0.33", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
# `default-features = false` + daftar ulang manual: fitur default eframe
# TERMASUK "glow" (backend OpenGL lewat egui_glow/glutin) walau kita HANYA
# pernah pakai backend wgpu (`eframe::Renderer::Wgpu` di ducad-app/
# main.rs) — glutin TIDAK mendukung iOS (gagal compile, match non-
# exhaustive di `Surface<T>`, ditemukan saat Fase 6). Daftar di bawah
# adalah daftar default eframe DIKURANGI "glow" — "winit/default" SENGAJA
# tidak diikutkan: itu sintaks `crate/fitur` yang cuma valid DI DALAM
# manifest eframe sendiri (Cargo menolaknya dari sisi consumer, "feature
# ... not allowed to contain slashes" — dicoba, gagal parse, bukan
# dugaan), DAN tidak dibutuhkan di sini — `rwh_06` (satu-satunya bagian
# penting yang biasanya lewat "winit/default") sudah diminta TANPA SYARAT
# oleh `[target...dependencies.winit]` eframe sendiri (lihat
# eframe-0.32.3/Cargo.toml, `features = ["rwh_06"]`, tak digerbangi fitur
# opsional apa pun). Satu-satunya yang hilang dibanding default penuh:
# "wayland-dlopen"/"wayland-csd-adwaita" (kosmetik Linux/Wayland saja,
# tak menyentuh macOS/iOS yang jadi target pengembangan saat ini).
# "persistence": satu-satunya jalan eframe memanggil `App::save` saat OS
# menidurkan aplikasi (iPadOS `applicationWillResignActive`, Android
# `onPause`) — dipakai autosave pemulihan di tablet (`platform.rs`).
# Pemulihan posisi jendela dimatikan lewat `persist_window: false`.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "persistence",
    "wayland",
    "web_screen_reader",
    "x11",
    "wgpu",
] }
egui = "0.36"
egui_wgpu = { package = "egui-wgpu", version = "0.36" }
egui_icons = "0.0.1"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Server MCP `ducad-mcp` (P3): gambar PNG di hasil tool.
base64 = "0.22"
# CLI `ducad-cli` (P2.1).
clap = { version = "4", features = ["derive"] }
# JSON Schema kontrak `Op` (ducad-engine, P1.2) untuk CLI/MCP.
schemars = "0.8"
# "serde" di sini mengaktifkan Serialize/Deserialize otomatis untuk tipe key
# hasil `slotmap::new_key_type!` (EntityId, BodyId) DAN untuk `SlotMap<K, V>`
# itu sendiri (indeks+versi internal ikut ter-serialize, jadi key yang sama
# persis didapat balik saat deserialize) — dipakai `ducad-io` (Fase 5) agar
# `Constraint`/`PointRef` yang menyimpan `EntityId` mentah bisa
# di-roundtrip apa adanya tanpa remapping id manual.
slotmap = { version = "1", features = ["serde"] }
image = "0.25"
log = "0.4"
env_logger = "0.11"
# Klien HTTP untuk ticket polling OAuth (`ducad-cloud`). `ureq` DIPILIH
# ketimbang `reqwest` yang dipakai tabular-client: alur poll-nya blocking
# di thread sendiri, jadi runtime async tidak dibutuhkan — dan workspace
# ini sama sekali belum menarik tokio/hyper, yang akan jadi penambahan
# graf dependensi terbesar di repo hanya untuk satu POST per 1.5 detik.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Ticket OAuth 128-bit acak + encoding hex-nya (`ducad-cloud`). `getrandom`
# langsung, bukan `rand`: yang dibutuhkan hanya mengisi 16 byte dari CSPRNG
# sistem, dan versi ini sudah ada di pohon dependensi — menarik `rand` akan
# menambah salinan ketiganya (0.9 dan 0.10 sudah masuk lewat dependensi lain).
getrandom = "0.3"
hex = "0.4"
# Pembaruan otomatis (`ducad-update`): checksum SHA-256 paket rilis, dan
# ekstraksi .zip rilis Windows (Linux memakai `tar` sistem, macOS `hdiutil`).
# Keduanya sudah ada di pohon dependensi lewat crate lain.
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }
# Dialog file native (Fase 5) — dipakai `ducad-app` untuk Buka/Simpan/
# Import/Export lewat picker OS asli (NSOpenPanel/NSSavePanel di macOS).
rfd = "0.17"
# 0.40 menyamakan `libsqlite3-sys` dengan yang dipakai pustaka MNEMONIC
# (P11.5): hanya satu paket boleh menautkan pustaka native `sqlite3`.
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }

# Modern Apple platform bridging (macOS & iOS) — https://github.com/madsmtm/objc2
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    # ducad-app/src/apple_ios.rs: observer notifikasi, NSArray<UTType>.
    "NSNotification",
    "NSOperation",
    "NSArray",
    "NSSet",
    "NSObject",
    "NSEnumerator",
    "NSFileManager",
    "NSPathUtilities",
    "NSString",
    "NSURL",
    "NSBundle",
    "NSProcessInfo",
    # `NSDictionary` dibutuhkan `ducad-cloud::auth::open_url` di iOS:
    # `-[UIApplication openURL:options:completionHandler:]` menuntut
    # dictionary opsi (boleh kosong), tidak ada overload tanpa itu.
    "NSDictionary",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSColor",
] }
objc2-ui-kit = { version = "0.3", features = [
    "UIDevice",
    "UIScreen",
    "UIApplication",
    # iPad (ducad-app/src/apple_ios.rs): Files.app, share sheet, Pencil, hover.
    "UIResponder",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
    "UIScene",
    # Siklus hidup UIScene (wajib sejak iOS 27 SDK): `UISceneDelegate`
    # `scene:willConnectToSession:options:` butuh tipe sesi + opsinya.
    "UISceneSession",
    "UISceneOptions",
    "UIDocumentPickerViewController",
    "UIActivityViewController",
    "UIPopoverPresentationController",
    "UIPresentationController",
    "UIGestureRecognizer",
    "UIHoverGestureRecognizer",
    "UIPencilInteraction",
    "UIInteraction",
    "UIFeedbackGenerator",
    "UIImpactFeedbackGenerator",
    "UISelectionFeedbackGenerator",
    "objc2-core-foundation",
    "objc2-uniform-type-identifiers",
] }
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# truck: assert khusus debug-nya menolak geometri yang sah (edge seam, edge
# tertutup) — SolidCraft sendiri mematikannya di semua profil tesnya (lihat
# vendors/solidcraft/README.md). Tanpa ini hasil kernel-truck di build dev/tes
# berbeda dari rilis.
[profile.dev.package.truck-base]
debug-assertions = false
[profile.dev.package.truck-geotrait]
debug-assertions = false
[profile.dev.package.truck-geometry]
debug-assertions = false
[profile.dev.package.truck-topology]
debug-assertions = false
[profile.dev.package.truck-polymesh]
debug-assertions = false
[profile.dev.package.truck-modeling]
debug-assertions = false
[profile.dev.package.truck-meshalgo]
debug-assertions = false
[profile.dev.package.truck-shapeops]
debug-assertions = false
[profile.dev.package.truck-stepio]
debug-assertions = false
[profile.dev.package.solidcraft-kernel]
debug-assertions = false
[profile.dev.package.solidcraft-geom]
debug-assertions = false

[profile.release]
opt-level = 3
# `lto = "thin"`, bukan "fat": fat LTO pada graf wgpu/egui + SolidCraft
# menaikkan waktu link rilis dan kebutuhan RAM runner CI. Sejak kernel
# Rust murni (0.6.0) fat LTO MUNGKIN memberi sesuatu pada boolean/tesselasi —
# naikkan hanya kalau benchmark (`cargo bench -p ducad-kernel`) membuktikannya.
lto = "thin"
codegen-units = 1
# `panic` SENGAJA "unwind", bukan "abort": pagar `catch_op_panic`
# (ducad-engine/src/guard.rs) dan `guard` SolidCraft mengubah panik di dalam
# op kernel menjadi error yang bisa di-rollback. "abort" akan mematikan
# aplikasi CAD berisi pekerjaan pengguna yang belum tersimpan.
panic = "unwind"
strip = "symbols"

[profile.bench]
inherits = "release"
# Simbol dipertahankan supaya profiler (Instruments/perf) bisa memberi
# nama fungsi pada hasil benchmark.
strip = "none"
debug = "line-tables-only"

[patch.crates-io]

# Backend truck (PLAN_MIGRASI_TRUCK F2): truck dengan perbaikan SolidCraft
# (boolean deterministik, tanpa panic pada kurva irisan degenerate, history
# face/edge). WAJIB ikut bersama `solidcraft-kernel`; daftar perubahan per
# crate ada di vendors/solidcraft/vendor/README.md (marker `SolidCraft:`).
truck-geometry = { path = "vendors/solidcraft/vendor/truck-geometry" }
truck-shapeops = { path = "vendors/solidcraft/vendor/truck-shapeops" }
truck-stepio = { path = "vendors/solidcraft/vendor/truck-stepio" }
truck-meshalgo = { path = "vendors/solidcraft/vendor/truck-meshalgo" }
matext4cgmath = { path = "vendors/solidcraft/vendor/matext4cgmath" }

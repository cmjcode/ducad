[package]
name = "ducad-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ducad"
path = "src/main.rs"

[dependencies]
ducad-core = { workspace = true }
ducad-sketch = { workspace = true }
ducad-kernel = { workspace = true }
ducad-render = { workspace = true }
ducad-io = { workspace = true }
ducad-ui = { workspace = true }
ducad-i18n = { workspace = true }
ducad-cloud = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_wgpu = { workspace = true }
egui_icons = { workspace = true }
glam = { workspace = true }
slotmap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
usvg = { version = "0.48", default-features = false }
resvg = { version = "0.48" }

# `rfd` (dialog file native) TIDAK COMPILE di iOS — tidak ada backend
# UIKit sama sekali (dibuktikan lewat probe crate terpisah saat Fase 6).
# Digeser jadi target-specific supaya `cargo build --target aarch64-apple-
# ios` tidak gagal di dependensi ini; pemanggilnya (`DuCADApp::
# pick_open_path`/`pick_save_path` di `file_io.rs`) di iOS menggunakan
# direktori Documents native dari Apple runtime.
[target.'cfg(not(target_os = "ios"))'.dependencies]
rfd = { workspace = true }

# Modern Apple platform bridging (macOS & iOS) — https://github.com/madsmtm/objc2
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { workspace = true }
block2 = { workspace = true }
objc2-foundation = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { workspace = true }

# Packaging desktop (Fase 7) lewat `cargo-bundle` (`cargo install cargo-
# bundle && cargo bundle --release -p ducad-app`) — dibaca `cargo-bundle`
# dari sini, TIDAK berpengaruh ke `cargo build`/`cargo run` biasa sama
# sekali (cuma metadata pasif). Lihat docs/PACKAGING.md untuk apa yang
# dihasilkan vs apa yang SENGAJA di luar lingkup (code signing/
# notarization/installer Windows/AppImage Linux — semua butuh sertifikat/
# GUI yang tidak tersedia di sandbox agent).
[package.metadata.bundle]
name = "DUCAD"
identifier = "id.ducad.studio"
icon = ["assets/icon.png"]
version = "0.1.0"
copyright = "Copyright (c) 2026 Yulius Jayuda"
category = "public.app-category.developer-tools"
short_description = "CAD 2D/3D — sketch, constraint, direct modeling, kernel OpenCASCADE"
long_description = """
DUCAD adalah aplikasi CAD gaya AutoCAD (drafting 2D presisi) yang \
berevolusi ke pemodelan 3D gaya Shapr3D (sketch -> extrude, direct \
modeling), dibangun di atas kernel geometri OpenCASCADE.
"""

[package]
name = "ducad-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ducad-core = { workspace = true }
ducad-sketch = { workspace = true }
ducad-kernel = { workspace = true }
ducad-io = { workspace = true }
ducad-i18n = { workspace = true }
ducad-cloud = { workspace = true }
ducad-glass = { workspace = true }
egui = { workspace = true }
glam = { workspace = true }
egui_icons = { workspace = true }
# Hack (bawaan egui, sudah di dependency tree) dipasang sebagai fallback glyph
# font proporsional: simbol seperti ⌀ ∠ ⊥ → ▼ tidak ada di Ubuntu/NotoEmoji.
epaint_default_fonts = "0.36"
serde = { workspace = true, optional = true }
serde_json = { workspace = true }

[features]
default = []
# Backend kernel (PLAN_MIGRASI_TRUCK F6): truck adalah default ducad-kernel.
# `--features kernel-occt` memilih OCCT untuk seluruh graf selama soak
# 0.6.0-beta (menang atas truck); `kernel-truck` dipertahankan agar perintah
# lama tetap jalan.
kernel-truck = ["ducad-kernel/kernel-truck"]
kernel-occt = ["ducad-kernel/kernel-occt"]
serde = ["dep:serde"]

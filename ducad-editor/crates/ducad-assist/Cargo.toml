[package]
name = "ducad-assist"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Asisten AI lokal/offline DUCAD: model mengusulkan aksi, hasilnya selalu proposal (P11)"

[features]
default = []
# Backend kernel (PLAN_MIGRASI_TRUCK F6): truck adalah default ducad-kernel.
# `--features kernel-occt` memilih OCCT untuk seluruh graf selama soak
# 0.6.0-beta (menang atas truck); `kernel-truck` dipertahankan agar perintah
# lama tetap jalan.
kernel-truck = ["ducad-engine/kernel-truck"]
kernel-occt = ["ducad-engine/kernel-occt"]
# Backend GGUF lokal di CPU (candle). Model tidak dibundel: lihat docs/adr/0002-ai-lokal.md.
local-gguf = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers"]
# Backend Apple Foundation Models lewat pustaka Swift statis (macOS 26+).
apple-fm = []

[dependencies]
ducad-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
candle-core = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
tokenizers = { version = "0.23.1", optional = true, default-features = false, features = ["onig"] }

[package]
name = "ducad-io"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Backend kernel (PLAN_MIGRASI_TRUCK F6): truck adalah default ducad-kernel.
# `--features kernel-occt` memilih OCCT untuk seluruh graf selama soak
# 0.6.0-beta (menang atas truck); `kernel-truck` dipertahankan agar perintah
# lama tetap jalan.
kernel-truck = ["ducad-kernel/kernel-truck"]
kernel-occt = ["ducad-kernel/kernel-occt"]

[dependencies]
ducad-core = { workspace = true }
ducad-ink = { workspace = true }
ducad-sketch = { workspace = true }
ducad-kernel = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
# Deflate murni-Rust (MIT/Zlib/Apache-2.0) untuk gambar raster di PDF/PNG lembar;
# sudah ada di Cargo.lock lewat `png`/`flate2`.
miniz_oxide = "0.8"

[dev-dependencies]
proptest = { workspace = true }

[package]
name = "ducad-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ducad-cli"
path = "src/main.rs"

[features]
default = []
# Backend AI di perangkat untuk `ducad-cli assist` (P11); mati secara default.
apple-fm = ["ducad-assist/apple-fm"]
local-gguf = ["ducad-assist/local-gguf"]

[dependencies]
ducad-assist = { workspace = true }
ducad-chat = { workspace = true }
ducad-mcp = { workspace = true }
ducad-engine = { workspace = true, features = ["raster"] }
ducad-io = { workspace = true }
ducad-core = { workspace = true }
ducad-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true }

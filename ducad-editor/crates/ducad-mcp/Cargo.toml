[package]
name = "ducad-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ducad-mcp"
path = "src/main.rs"

[features]
# Backend kernel (PLAN_MIGRASI_TRUCK F6): truck adalah default ducad-kernel.
# `--features kernel-occt` memilih OCCT untuk seluruh graf selama soak
# 0.6.0-beta (menang atas truck); `kernel-truck` dipertahankan agar perintah
# lama tetap jalan.
kernel-truck = ["ducad-kernel/kernel-truck"]
kernel-occt = ["ducad-kernel/kernel-occt"]

[dependencies]
ducad-engine = { workspace = true, features = ["raster"] }
ducad-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
base64 = { workspace = true }

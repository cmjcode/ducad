[package]
name = "ducad-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ducad-mcp"
path = "src/main.rs"

[features]
# Backend kernel truck (PLAN_MIGRASI_TRUCK F2): `--features kernel-truck`
# mengalihkan seluruh graf ke SolidCraft/truck (menang atas OCCT default).
kernel-truck = ["ducad-kernel/kernel-truck"]

[dependencies]
ducad-engine = { workspace = true, features = ["raster"] }
ducad-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
base64 = { workspace = true }

[package]
name = "ducad-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ducad-core = { workspace = true }
ducad-sketch = { workspace = true }
ducad-kernel = { workspace = true }
ducad-io = { workspace = true }
ducad-sim = { workspace = true }
glam = { workspace = true }
slotmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Fitur `raster`: SVG → PNG untuk CLI/MCP. Versi sama dengan ducad-app.
resvg = { version = "0.48", optional = true }
usvg = { version = "0.48", optional = true, default-features = false }

[features]
default = []
# Backend kernel (PLAN_MIGRASI_TRUCK F6): truck adalah default ducad-kernel.
# `--features kernel-occt` memilih OCCT untuk seluruh graf selama soak
# 0.6.0-beta (menang atas truck); `kernel-truck` dipertahankan agar perintah
# lama tetap jalan.
kernel-truck = ["ducad-kernel/kernel-truck"]
kernel-occt = ["ducad-kernel/kernel-occt"]
raster = ["dep:resvg", "dep:usvg"]

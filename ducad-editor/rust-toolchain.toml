# Menjamin `rustfmt` + `clippy` selalu tersedia di mesin dev maupun runner
# CI, sehingga gate mutu bisa dijalankan di mana saja tanpa langkah setup
# manual.
#
# Versi DIPAKU (PLAN_MIGRASI_TRUCK F0.4): rilis stable baru bisa menambah
# lint dan membuat `clippy -D warnings` mendadak merah tanpa ada perubahan
# kode, dan golden corpus (`ducad-cli golden check`) butuh build yang
# reproduktif. SolidCraft kernel (backend truck) butuh rustc >= 1.95 /
# edition 2024.
#
# Menaikkan versi = PR tersendiri: ubah `channel` di sini DAN semua
# `dtolnay/rust-toolchain@<versi>` di `.github/workflows/*.yml`.
[toolchain]
channel = "1.96.1"
components = ["rustfmt", "clippy"]

# DUCAD: manifest ditulis ulang dari SolidCraft c66e332 (nilai `workspace = true`
# diganti nilai eksplisit dari Cargo.toml workspace SolidCraft), karena crate ini
# di-vendor di luar workspace aslinya. Kode sumber tidak diubah.
# Patch truck (`vendor/truck-*`) dipasang lewat `[patch.crates-io]` di
# ducad-editor/Cargo.toml — tanpa itu boolean tidak deterministik dan bisa panic.
[package]
name = "solidcraft-kernel"
description = "SolidCraft B-rep kernel boundary: solids, extrude/revolve/booleans/fillets, tessellation, measures and STEP, behind our own API (implemented with truck)"
version = "0.16.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
solidcraft-geom = { path = "../geom" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
log = "0.4"
truck-modeling = "0.6"
truck-shapeops = { version = "0.4", default-features = false }
truck-meshalgo = { version = "0.4", default-features = false, features = ["tessellation", "analyzers"] }
truck-stepio = { version = "0.3", default-features = false }
truck-topology = "0.6"
spade = { version = "2.15", default-features = false, features = ["std"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12"

[dev-dependencies]
# The vendored crate tests never build in CI, so its equivalence checks run from kernel tests.
# Resolver 3 keeps this dev-only feature out of shipped builds.
truck-meshalgo = { version = "0.4", default-features = false, features = ["tessellation", "analyzers", "test-hooks"] }
proptest = { version = "1", default-features = false, features = ["std"] }

name: release-cli

# Binary headless (`ducad-cli` + `ducad-mcp`) untuk CI pengguna: kompilasi
# OCCT ±15 menit membuat `cargo install` di runner pengguna tidak layak.
# Templat workflow pengguna: `ducad-editor/docs/ci/ducad-build.yml`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

defaults:
  run:
    working-directory: ducad-editor

jobs:
  macos-arm64:
    name: ducad-tools (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolusi revisi OCCT
        id: occt
        run: echo "sha=$(git -C vendors/opencascade-rs rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache artefak build OCCT
        uses: actions/cache@v4
        with:
          path: ducad-editor/target/release/build
          key: occt-release-${{ runner.os }}-${{ steps.occt.outputs.sha }}-${{ hashFiles('ducad-editor/Cargo.lock') }}
          restore-keys: |
            occt-release-${{ runner.os }}-${{ steps.occt.outputs.sha }}-

      - name: Build
        run: cargo build --release -p ducad-cli -p ducad-mcp

      - name: Uji asap
        run: |
          ./target/release/ducad-cli build crates/ducad-engine/tests/fixtures/plate.ops.json \
            --out "$RUNNER_TEMP/smoke" --date 2026-01-01
          test -s "$RUNNER_TEMP/smoke/plate.step"

      - name: Paket
        run: |
          mkdir -p dist/pkg
          cp target/release/ducad-cli target/release/ducad-mcp dist/pkg/
          tar -C dist/pkg -czf dist/ducad-tools-macos-arm64.tar.gz ducad-cli ducad-mcp
          shasum -a 256 dist/ducad-tools-macos-arm64.tar.gz > dist/ducad-tools-macos-arm64.tar.gz.sha256

      - name: Unggah aset rilis
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/ducad-tools-macos-arm64.tar.gz dist/ducad-tools-macos-arm64.tar.gz.sha256 --clobber

      - name: Simpan artefak (workflow_dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ducad-tools-macos-arm64
          path: ducad-editor/dist/ducad-tools-macos-arm64.tar.gz*

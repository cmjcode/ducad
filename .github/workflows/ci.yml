name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: ducad-editor
    # Git Bash juga tersedia di runner Windows, jadi satu skrip untuk semua.
    shell: bash

jobs:
  # ---------------------------------------------------------------------
  # Lane cepat (< 2 menit): crate tanpa kernel.
  # ---------------------------------------------------------------------
  # Basis kode belum pernah dilewatkan rustfmt: `cargo fmt --all --check`
  # saat ini melaporkan ~1.628 selisih yang tersebar di hampir seluruh
  # berkas. Job ini SENGAJA belum memblokir.
  #
  # Memberlakukannya per-berkas-yang-disentuh sempat dicoba dan DITOLAK:
  # berkas di sini besar-besar (`app.rs` 3.836 baris), sehingga menambah
  # satu alias tipe saja akan memaksa reformat seluruh berkas — persis
  # churn yang ingin dihindari.
  #
  # Cara membereskannya, saat tidak ada pekerjaan besar yang sedang
  # berjalan di branch lain:
  #
  #   cd ducad-editor && cargo fmt --all
  #   cargo test --workspace          # rustfmt menjaga semantik; buktikan
  #   git commit -am "style: rustfmt seluruh workspace"
  #   git rev-parse HEAD >> ../.git-blame-ignore-revs
  #   git config blame.ignoreRevsFile .git-blame-ignore-revs
  #
  # Setelah itu: hapus `continue-on-error` di bawah agar gate memblokir.
  fmt:
    name: rustfmt (belum memblokir)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  quick:
    name: clippy + test (crate tanpa kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ducad-editor
          key: quick
      # `ducad-core`/`-sketch`/`-render`/`-i18n`/`-cloud`/`-update` tidak
      # bergantung pada `ducad-kernel`, jadi memberi sinyal gagal dalam
      # hitungan menit.
      - name: clippy
        run: >
          cargo clippy
          -p ducad-core -p ducad-sketch -p ducad-render -p ducad-i18n -p ducad-cloud
          -p ducad-update
          --all-targets -- -D warnings
      - name: test
        run: >
          cargo test
          -p ducad-core -p ducad-sketch -p ducad-render -p ducad-i18n -p ducad-cloud
          -p ducad-update

  # Kernel (SolidCraft/truck): clippy + tes modul/kontrak + fuzz boolean
  # (`tests/fuzz_boolean.rs`, 24 seed; gate penuh: `SEEDS=0..95`) + wasm32.
  truck:
    name: kernel (clippy + test + wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ducad-editor
          key: truck
      - name: clippy
        run: >
          cargo clippy -p ducad-kernel --all-targets -- -D warnings
      - name: test
        run: cargo test -p ducad-kernel
      # F6.2: kernel terkompilasi untuk web (rayon dipagari
      # `target_arch = "wasm32"` di SolidCraft `par.rs`; tanpa thread pool).
      - name: check wasm32
        run: cargo check -p ducad-kernel --target wasm32-unknown-unknown

  # Updater aplikasi punya jalur khusus per OS (`cfg(target_os)`: hdiutil/
  # codesign/lipo di macOS, zip di Windows, tar di Linux). Lane penuh tidak
  # menjalankan macOS, jadi crate ini (< 2 menit) dicek di
  # ketiga OS di sini.
  update:
    name: ducad-update (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ducad-editor
          key: update-${{ matrix.os }}
      - run: cargo clippy -p ducad-update --all-targets -- -D warnings
      - run: cargo test -p ducad-update

  # ---------------------------------------------------------------------
  # Lane penuh: seluruh workspace, Linux + Windows (Rust murni, tanpa cmake).
  #
  # Paket macOS hanya dibangun di mesin lokal (Developer ID + notarisasi:
  # `make bundle-macos` + `./notarize.sh`); jalankan `cargo test --workspace`
  # di macOS sebelum rilis.
  # ---------------------------------------------------------------------
  full:
    name: clippy + test (workspace, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Pasang dependensi sistem Linux
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ducad-editor
          key: full-${{ matrix.os }}

      - name: clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Windows baru masuk CI: kode produksi sudah memagari API Unix
      # (`agent_bridge`, `attach`) dengan `cfg(unix)`, tetapi sebagian tes
      # masih memakai `std::os::unix` + skrip `/bin/sh` tanpa pagar. Jadi di
      # Windows yang memblokir hanya clippy lib/bin; clippy semua target dan
      # tes dicatat tanpa memblokir sampai tes-tes itu diberi `#[cfg(unix)]`.
      - name: clippy (lib + bin)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace -- -D warnings

      - name: clippy semua target (Windows, belum memblokir)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Tes yang membangun valve body dilewati saat runtime (R7,
      # known_failures.truck.txt) sampai performanya diperbaiki.
      - name: test
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: cargo test --workspace

      # Gate kernel: replay korpus contoh terhadap golden yang direkam dengan
      # OCCT sebelum migrasi (tests/goldens/occt, referensi beku). Perbedaan
      # yang diterima (beserta alasannya) ada di
      # `tests/goldens/known_failures.truck.txt`; perbedaan lain = gagal.
      - name: golden
        if: runner.os == 'Linux'
        run: >
          cargo run -p ducad-cli --
          golden check --against tests/goldens/occt --tol 1e-3
          --known tests/goldens/known_failures.truck.txt

  # ---------------------------------------------------------------------
  # Audit dependensi. Sengaja TIDAK memblokir merge untuk sekarang:
  # backlog advisory/lisensi belum pernah dibereskan, dan gate merah sejak
  # hari pertama hanya melatih orang mengabaikannya. Hapus
  # `continue-on-error` begitu `cargo deny check` hijau sekali.
  # ---------------------------------------------------------------------
  deny:
    name: cargo-deny (belum memblokir)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ducad-editor/Cargo.toml
          command: check

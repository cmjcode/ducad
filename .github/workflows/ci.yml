name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # OCCT membawa CMakeLists dengan `cmake_minimum_required` di bawah batas
  # yang diterima CMake 4.x. Nilai ini mencerminkan
  # `ducad-editor/.cargo/config.toml` supaya CI identik dengan build lokal.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

defaults:
  run:
    working-directory: ducad-editor
    # Git Bash juga tersedia di runner Windows, jadi satu skrip untuk semua.
    shell: bash

jobs:
  # ---------------------------------------------------------------------
  # Lane cepat (< 2 menit): tidak menyentuh OCCT sama sekali.
  # ---------------------------------------------------------------------
  # Basis kode belum pernah dilewatkan rustfmt: `cargo fmt --all --check`
  # saat ini melaporkan ~1.628 selisih yang tersebar di hampir seluruh
  # berkas. Job ini SENGAJA belum memblokir.
  #
  # Memberlakukannya per-berkas-yang-disentuh sempat dicoba dan DITOLAK:
  # berkas di sini besar-besar (`app.rs` 3.836 baris), sehingga menambah
  # satu alias tipe saja akan memaksa reformat seluruh berkas — persis
  # churn yang ingin dihindari.
  #
  # Cara membereskannya, saat tidak ada pekerjaan besar yang sedang
  # berjalan di branch lain:
  #
  #   cd ducad-editor && cargo fmt --all
  #   cargo test --workspace          # rustfmt menjaga semantik; buktikan
  #   git commit -am "style: rustfmt seluruh workspace"
  #   git rev-parse HEAD >> ../.git-blame-ignore-revs
  #   git config blame.ignoreRevsFile .git-blame-ignore-revs
  #
  # Setelah itu: hapus `continue-on-error` di bawah agar gate memblokir.
  fmt:
    name: rustfmt (belum memblokir)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Tanpa submodule: rustfmt hanya mem-parse berkas, tidak pernah build.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  quick:
    name: clippy + test (crate tanpa kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ducad-editor
          key: quick
      # `ducad-core`/`-sketch`/`-render`/`-i18n`/`-cloud`/`-update` tidak
      # bergantung pada `ducad-kernel`, jadi tidak butuh OCCT dan memberi sinyal gagal
      # dalam hitungan menit alih-alih belasan menit.
      - name: clippy
        run: >
          cargo clippy
          -p ducad-core -p ducad-sketch -p ducad-render -p ducad-i18n -p ducad-cloud
          -p ducad-update
          --all-targets -- -D warnings
      - name: test
        run: >
          cargo test
          -p ducad-core -p ducad-sketch -p ducad-render -p ducad-i18n -p ducad-cloud
          -p ducad-update

  # Updater aplikasi punya jalur khusus per OS (`cfg(target_os)`: hdiutil/
  # codesign/lipo di macOS, zip di Windows, tar di Linux). Lane penuh tidak
  # menjalankan macOS, jadi crate ini (tanpa OCCT, < 2 menit) dicek di
  # ketiga OS di sini.
  update:
    name: ducad-update (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ducad-editor
          key: update-${{ matrix.os }}
      - run: cargo clippy -p ducad-update --all-targets -- -D warnings
      - run: cargo test -p ducad-update

  # ---------------------------------------------------------------------
  # Lane penuh: membangun OCCT (~10-15 menit tanpa cache).
  #
  # Hanya Linux + Windows. Paket macOS dibangun `release.yml` (ad-hoc) atau
  # di mesin lokal untuk Developer ID (`make bundle-macos` + `./notarize.sh`);
  # jalankan `cargo test --workspace` di macOS sebelum rilis.
  # ---------------------------------------------------------------------
  full:
    name: clippy + test (workspace, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pohon sumber OCCT punya path yang melewati batas MAX_PATH Windows.
      - name: Izinkan path panjang (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pasang dependensi sistem Linux
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libgtk-3-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev

      # ducad-editor/.cargo/config.toml mengunci generator ke VS 2022 (untuk
      # mesin dev), padahal image runner bisa membawa VS versi lain. Env proses
      # menang atas [env] Cargo, jadi pilih generator sesuai VS yang terpasang.
      - name: Pilih generator CMake sesuai Visual Studio runner
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          # Generator bertanda `*` di `cmake --help` = VS terbaru yang terpasang.
          # (Jangan merakit nama dari vswhere: VS 2026 melaporkan
          # catalog_productLineVersion "18", bukan "2026".)
          $line = cmake --help | Select-String '^\*\s+(Visual Studio \d+ \d{4})' | Select-Object -First 1
          if (-not $line) { throw 'Generator Visual Studio default tidak ditemukan di cmake --help' }
          $gen = $line.Matches[0].Groups[1].Value
          Write-Host "Generator CMake: $gen"
          "CMAKE_GENERATOR_x86_64_pc_windows_msvc=$gen" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Revisi submodule adalah satu-satunya masukan yang menentukan hasil
      # build OCCT, jadi dipakai sebagai kunci cache.
      - name: Resolusi revisi OCCT
        id: occt
        run: echo "sha=$(git -C vendors/opencascade-rs rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache artefak build OCCT
        uses: actions/cache@v4
        with:
          path: ducad-editor/target/debug/build
          key: occt-${{ runner.os }}-${{ steps.occt.outputs.sha }}-${{ hashFiles('ducad-editor/Cargo.lock') }}
          restore-keys: |
            occt-${{ runner.os }}-${{ steps.occt.outputs.sha }}-

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ducad-editor
          key: full-${{ matrix.os }}
          # Jangan biarkan rust-cache memangkas direktori build: di situlah
          # hasil kompilasi OCCT disimpan (lihat langkah cache di atas).
          cache-directories: ducad-editor/target/debug/build

      - name: clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Windows baru masuk CI: kode produksi sudah memagari API Unix
      # (`agent_bridge`, `attach`) dengan `cfg(unix)`, tetapi sebagian tes
      # masih memakai `std::os::unix` + skrip `/bin/sh` tanpa pagar. Jadi di
      # Windows yang memblokir hanya clippy lib/bin; clippy semua target dan
      # tes dicatat tanpa memblokir sampai tes-tes itu diberi `#[cfg(unix)]`.
      - name: clippy (lib + bin)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace -- -D warnings

      - name: clippy semua target (Windows, belum memblokir)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: cargo test --workspace

  # ---------------------------------------------------------------------
  # Audit dependensi. Sengaja TIDAK memblokir merge untuk sekarang:
  # backlog advisory/lisensi belum pernah dibereskan, dan gate merah sejak
  # hari pertama hanya melatih orang mengabaikannya. Hapus
  # `continue-on-error` begitu `cargo deny check` hijau sekali.
  # ---------------------------------------------------------------------
  deny:
    name: cargo-deny (belum memblokir)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ducad-editor/Cargo.toml
          command: check

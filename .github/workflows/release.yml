name: release

# Paket rilis Windows + Linux: aplikasi GUI (`ducad`) beserta binary headless
# (`ducad-cli` + `ducad-mcp`). Kompilasi OCCT ±15 menit membuat
# `cargo install` di runner pengguna tidak layak, jadi tarball `ducad-tools-*`
# juga dipakai templat `ducad-editor/docs/ci/ducad-build.yml`.
#
# macOS SENGAJA tidak dibangun di sini: bundel .app harus ditandatangani
# Developer ID dan dinotarisasi, dan itu dikerjakan di mesin lokal
# (`make bundle-macos` + `./notarize.sh`, lalu unggah manual ke rilis yang
# sama dengan `gh release upload vX.Y.Z dist/macos/…`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

defaults:
  run:
    working-directory: ducad-editor
    # Git Bash juga tersedia di runner Windows, jadi satu skrip untuk semua.
    shell: bash

jobs:
  build:
    name: paket (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 (bukan latest) supaya binary tetap jalan di glibc yang
          # lebih lama.
          - platform: linux-x86_64
            os: ubuntu-22.04
            exe: ""
          - platform: windows-x86_64
            os: windows-latest
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      # Pohon sumber OCCT punya path yang melewati batas MAX_PATH Windows.
      - name: Izinkan path panjang (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pasang dependensi sistem Linux
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libgtk-3-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolusi revisi OCCT
        id: occt
        run: echo "sha=$(git -C vendors/opencascade-rs rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache artefak build OCCT
        uses: actions/cache@v4
        with:
          path: ducad-editor/target/release/build
          key: occt-release-${{ runner.os }}-${{ steps.occt.outputs.sha }}-${{ hashFiles('ducad-editor/Cargo.lock') }}
          restore-keys: |
            occt-release-${{ runner.os }}-${{ steps.occt.outputs.sha }}-

      - name: Build
        run: cargo build --release -p ducad-app -p ducad-cli -p ducad-mcp

      - name: Uji asap
        run: |
          ./target/release/ducad-cli${{ matrix.exe }} build crates/ducad-engine/tests/fixtures/plate.ops.json \
            --out "$RUNNER_TEMP/smoke" --date 2026-01-01
          test -s "$RUNNER_TEMP/smoke/plate.step"

      - name: Paket
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE: ${{ matrix.exe }}
        run: |
          VERSION=$(tr -d ' \r\n' < VERSION)
          APP="ducad-$VERSION-$PLATFORM"
          TOOLS="ducad-tools-$PLATFORM"
          mkdir -p "dist/ci/$APP" "dist/ci/$TOOLS"
          for b in ducad ducad-cli ducad-mcp; do cp "target/release/$b$EXE" "dist/ci/$APP/"; done
          cp assets/icon.png VERSION "dist/ci/$APP/"
          cp "target/release/ducad-cli$EXE" "target/release/ducad-mcp$EXE" "dist/ci/$TOOLS/"
          cd dist/ci
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$APP.zip" "$APP" >/dev/null
            7z a -tzip "$TOOLS.zip" "./$TOOLS/*" >/dev/null
          else
            tar -czf "$APP.tar.gz" "$APP"
            tar -C "$TOOLS" -czf "$TOOLS.tar.gz" ducad-cli ducad-mcp
          fi
          for f in *.zip *.tar.gz; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ducad-${{ matrix.platform }}
          path: |
            ducad-editor/dist/ci/*.zip
            ducad-editor/dist/ci/*.tar.gz
            ducad-editor/dist/ci/*.sha256

  # Satu job yang membuat/mengisi rilis, supaya dua job matriks tidak
  # berebut `gh release create`.
  publish:
    name: unggah aset rilis
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Unggah
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

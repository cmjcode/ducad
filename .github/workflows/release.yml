name: release

# Paket rilis Windows + Linux: aplikasi GUI (`ducad`) beserta binary
# headless (`ducad-cli` + `ducad-mcp`). Tarball `ducad-tools-*` juga dipakai
# templat `ducad-editor/docs/ci/ducad-build.yml`.
#
# Kernel geometri SolidCraft/truck adalah Rust murni: tidak ada cmake,
# submodule, atau kompilasi C++ (PLAN_MIGRASI_TRUCK F6.4).
#
# Pembaruan otomatis di aplikasi (`crates/ducad-update`) membaca rilis
# `latest` dan mencocokkan NAMA aset — ubah pola nama di sini = ubah juga
# `select_package` di sana:
#
#   ducad-<versi>-linux-x86_64.tar.gz    + .sha256
#   ducad-<versi>-windows-x86_64.zip     + .sha256
#   DUCAD-<versi>-macos-arm64.dmg        + .sha256   (unggah manual, lihat bawah)
#
# Plus installer `ducad-<versi>-windows-x86_64.msi` (+ .sha256) untuk
# instalasi pertama. Updater TIDAK memakainya (ia hanya memilih .zip); MSI
# memasang per-user ke folder yang sama-sama bisa ditimpa updater.
#
# macOS TIDAK dibangun di CI: DMG harus ditandatangani Developer ID dan
# dinotarisasi, dan itu dilakukan di mesin lokal. Karena itu workflow ini
# hanya mengisi rilis DRAFT; updater (yang membaca `latest`) tidak melihat
# rilis sebelum paket macOS ikut masuk. Setelah workflow selesai:
#   cd ducad-editor && make bundle-macos && ./notarize.sh
#   mv dist/macos/DUCAD-X.Y.Z.dmg dist/macos/DUCAD-X.Y.Z-macos-arm64.dmg
#   (cd dist/macos && shasum -a 256 DUCAD-X.Y.Z-macos-arm64.dmg > DUCAD-X.Y.Z-macos-arm64.dmg.sha256)
#   gh release upload vX.Y.Z dist/macos/DUCAD-X.Y.Z-macos-arm64.dmg{,.sha256}
#   gh release edit vX.Y.Z --draft=false --latest   # pra-rilis: --prerelease

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: ducad-editor
    # Git Bash juga tersedia di runner Windows, jadi satu skrip untuk semua.
    shell: bash

jobs:
  # Satu sumber versi untuk semua job. Tag, `VERSION` (root), dan
  # `[workspace.package].version` harus sama: versi di nama aset harus sama
  # dengan `CARGO_PKG_VERSION` yang dibandingkan updater di aplikasi.
  # `scripts/release-tag.sh` menjaga ketiganya selaras.
  version:
    name: cek versi
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          CARGO_VER=$(awk -F'"' '/^\[/ { s = ($0 == "[workspace.package]") } s && /^version[ \t]*=/ { print $2; exit }' Cargo.toml)
          ROOT_VER=$(tr -d ' \r\n' < ../VERSION)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then WANT="${GITHUB_REF_NAME#v}"; else WANT="$CARGO_VER"; fi
          echo "tag/ref: $WANT  Cargo.toml: $CARGO_VER  VERSION: $ROOT_VER"
          if [ -z "$WANT" ] || [ "$CARGO_VER" != "$WANT" ] || [ "$ROOT_VER" != "$WANT" ]; then
            echo "::error::Versi tidak selaras (tag=$WANT, Cargo.toml=$CARGO_VER, VERSION=$ROOT_VER). Pakai scripts/release-tag.sh."
            exit 1
          fi
          echo "version=$WANT" >> "$GITHUB_OUTPUT"

  build:
    name: paket (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 (bukan latest) supaya binary tetap jalan di glibc yang
          # lebih lama.
          - platform: linux-x86_64
            os: ubuntu-22.04
            exe: ""
          - platform: windows-x86_64
            os: windows-latest
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Pasang dependensi sistem Linux
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@1.96.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ducad-editor
          key: release-${{ matrix.platform }}

      - name: Build
        run: cargo build --release -p ducad-app -p ducad-cli -p ducad-mcp

      - name: Uji asap
        run: |
          ./target/release/ducad-cli${{ matrix.exe }} build crates/ducad-engine/tests/fixtures/plate.ops.json \
            --out "$RUNNER_TEMP/smoke" --date 2026-01-01
          test -s "$RUNNER_TEMP/smoke/plate.step"

      # Isi paket = isi folder instalasi yang ditimpa updater: `ducad<exe>`
      # wajib ada (updater menolak paket tanpa executable yang berjalan).
      - name: Paket
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE: ${{ matrix.exe }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          APP="ducad-$VERSION-$PLATFORM"
          TOOLS="ducad-tools-$PLATFORM"
          mkdir -p "dist/ci/$APP" "dist/ci/$TOOLS"
          for b in ducad ducad-cli ducad-mcp; do cp "target/release/$b$EXE" "dist/ci/$APP/"; done
          cp assets/icon.png "dist/ci/$APP/"
          printf '%s\n' "$VERSION" > "dist/ci/$APP/VERSION"
          cp "target/release/ducad-cli$EXE" "target/release/ducad-mcp$EXE" "dist/ci/$TOOLS/"
          cd dist/ci
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$APP.zip" "$APP" >/dev/null
            7z a -tzip "$TOOLS.zip" "./$TOOLS/*" >/dev/null
          else
            tar -czf "$APP.tar.gz" "$APP"
            tar -C "$TOOLS" -czf "$TOOLS.tar.gz" ducad-cli ducad-mcp
          fi
          for f in *.zip *.tar.gz; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -l

      # Installer .msi (WiX v5, sumber: packaging/windows/ducad.wxs) untuk
      # instalasi pertama yang mudah. Per-user ke %LOCALAPPDATA%\Programs\DUCAD
      # supaya updater bawaan (yang memakai .zip) tetap bisa menimpa folder.
      - name: Pasang WiX
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE\\.dotnet\\tools" >> "$GITHUB_PATH"

      - name: Installer MSI
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          MSI="ducad-$VERSION-windows-x86_64.msi"
          wix build packaging/windows/ducad.wxs -arch x64 \
            -d Version="$VERSION" \
            -d BinDir=target/release \
            -d AssetsDir=assets \
            -d VersionFile="dist/ci/ducad-$VERSION-windows-x86_64/VERSION" \
            -o "dist/ci/$MSI"
          wix msi validate "dist/ci/$MSI"
          (cd dist/ci && sha256sum "$MSI" > "$MSI.sha256")
          ls -l dist/ci/*.msi

      - name: Uji pasang/copot MSI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $msi = (Resolve-Path "dist/ci/ducad-$env:VERSION-windows-x86_64.msi").Path
          $dir = Join-Path $env:LOCALAPPDATA "Programs\DUCAD"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\msi-install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi-install.log" -Tail 60; throw "msiexec /i gagal: $($p.ExitCode)" }
          foreach ($f in "ducad.exe", "ducad-cli.exe", "ducad-mcp.exe", "icon.png", "VERSION") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "berkas tidak terpasang: $f" }
          }
          if ((Get-Content (Join-Path $dir "VERSION")).Trim() -ne $env:VERSION) { throw "VERSION terpasang tidak cocok" }
          & (Join-Path $dir "ducad-cli.exe") build crates/ducad-engine/tests/fixtures/plate.ops.json --out "$env:RUNNER_TEMP\smoke-msi" --date 2026-01-01
          if ($LASTEXITCODE -ne 0) { throw "ducad-cli terpasang gagal jalan" }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x gagal: $($p.ExitCode)" }
          if (Test-Path (Join-Path $dir "ducad.exe")) { throw "copot tidak membersihkan folder instalasi" }

      - uses: actions/upload-artifact@v4
        with:
          name: ducad-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            ducad-editor/dist/ci/*.msi
            ducad-editor/dist/ci/*.zip
            ducad-editor/dist/ci/*.tar.gz
            ducad-editor/dist/ci/*.sha256

  # Satu job yang membuat/mengisi rilis, supaya job build tidak berebut
  # `gh release create`.
  publish:
    name: unggah aset rilis
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verifikasi aset
        env:
          VERSION: ${{ needs.version.outputs.version }}
        working-directory: dist
        run: |
          required=(
            "ducad-$VERSION-linux-x86_64.tar.gz"
            "ducad-$VERSION-windows-x86_64.zip"
            "ducad-$VERSION-windows-x86_64.msi"
            "ducad-tools-linux-x86_64.tar.gz"
            "ducad-tools-windows-x86_64.zip"
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "::error::aset hilang: $f"; exit 1; }
            test -s "$f.sha256" || { echo "::error::checksum hilang: $f.sha256"; exit 1; }
          done
          for s in *.sha256; do sha256sum -c "$s"; done
          ls -l

      - name: Isi rilis draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # Tetap DRAFT: DMG macOS ternotarisasi diunggah dari mesin lokal,
          # lalu rilis diterbitkan manual (lihat komentar di atas berkas).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --generate-notes --title "DUCAD $TAG"
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json assets -q '.assets[].name'
          echo "::notice::Rilis $TAG masih draft — unggah DMG macOS ternotarisasi lalu terbitkan."

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Yulius Jayuda <yulius.jayuda@gmail.com>"]

[workspace.dependencies]
ducad-core = { path = "crates/ducad-core" }
ducad-sketch = { path = "crates/ducad-sketch" }
ducad-kernel = { path = "crates/ducad-kernel" }
ducad-render = { path = "crates/ducad-render" }
ducad-io = { path = "crates/ducad-io" }
ducad-ui = { path = "crates/ducad-ui" }

glam = { version = "0.33", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
# `default-features = false` + daftar ulang manual: fitur default eframe
# TERMASUK "glow" (backend OpenGL lewat egui_glow/glutin) walau kita HANYA
# pernah pakai backend wgpu (`eframe::Renderer::Wgpu` di ducad-app/
# main.rs) — glutin TIDAK mendukung iOS (gagal compile, match non-
# exhaustive di `Surface<T>`, ditemukan saat Fase 6). Daftar di bawah
# adalah daftar default eframe DIKURANGI "glow" — "winit/default" SENGAJA
# tidak diikutkan: itu sintaks `crate/fitur` yang cuma valid DI DALAM
# manifest eframe sendiri (Cargo menolaknya dari sisi consumer, "feature
# ... not allowed to contain slashes" — dicoba, gagal parse, bukan
# dugaan), DAN tidak dibutuhkan di sini — `rwh_06` (satu-satunya bagian
# penting yang biasanya lewat "winit/default") sudah diminta TANPA SYARAT
# oleh `[target...dependencies.winit]` eframe sendiri (lihat
# eframe-0.32.3/Cargo.toml, `features = ["rwh_06"]`, tak digerbangi fitur
# opsional apa pun). Satu-satunya yang hilang dibanding default penuh:
# "wayland-dlopen"/"wayland-csd-adwaita" (kosmetik Linux/Wayland saja,
# tak menyentuh macOS/iOS yang jadi target pengembangan saat ini).
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "web_screen_reader",
    "x11",
    "wgpu",
] }
egui = "0.36"
egui_wgpu = { package = "egui-wgpu", version = "0.36" }
egui_material_icons = "0.8"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "serde" di sini mengaktifkan Serialize/Deserialize otomatis untuk tipe key
# hasil `slotmap::new_key_type!` (EntityId, BodyId) DAN untuk `SlotMap<K, V>`
# itu sendiri (indeks+versi internal ikut ter-serialize, jadi key yang sama
# persis didapat balik saat deserialize) — dipakai `ducad-io` (Fase 5) agar
# `Constraint`/`PointRef` yang menyimpan `EntityId` mentah bisa
# di-roundtrip apa adanya tanpa remapping id manual.
slotmap = { version = "1", features = ["serde"] }
image = "0.25"
log = "0.4"
env_logger = "0.11"
opencascade = "0.2"
# Dialog file native (Fase 5) — dipakai `ducad-app` untuk Buka/Simpan/
# Import/Export lewat picker OS asli (NSOpenPanel/NSSavePanel di macOS).
rfd = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Modern Apple platform bridging (macOS & iOS) — https://github.com/madsmtm/objc2
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSFileManager",
    "NSPathUtilities",
    "NSString",
    "NSURL",
    "NSBundle",
    "NSProcessInfo",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSColor",
] }
objc2-ui-kit = { version = "0.3", features = [
    "UIDevice",
    "UIScreen",
    "UIApplication",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# `faces_along_ray` upstream meng-hardcode toleransi geometris OCCT ke
# 0.0001 — terlalu ketat utk ray oblique kamera 3D nyata, bikin face-pick
# selalu None utk sisi samping. `Shape`/`Face` upstream simpan handle FFI
# `pub(crate)` (tidak bisa ditembus dari luar crate), jadi satu-satunya
# jalan adalah vendor + patch minimal (tambah method baru bertoleransi
# custom, TIDAK mengubah method lama) — lihat vendor/README.md.
#
# `opencascade-sys` (DUCAD Fase 2) di-vendor terpisah dari `opencascade`
# di atas: binding baru (BRepAdaptor_Surface, BRepOffset_MakeOffset) butuh
# akses langsung ke cxx bridge mentah (src/lib.rs + include/wrapper.hxx) —
# level yang berada SATU LAPIS DI BAWAH `opencascade`, dan `opencascade`
# vendored di sini otomatis memakai copy lokal ini lewat resolusi
# `[patch.crates-io]` yang sama (dependensinya "opencascade-sys = \"0.2\""
# tak berubah). Lihat vendor/README.md.
[patch.crates-io]
opencascade = { path = "vendor/opencascade-0.2.0" }
opencascade-sys = { path = "vendor/opencascade-sys-0.2.0" }
egui_material_icons = { path = "vendor/egui_material_icons" }

